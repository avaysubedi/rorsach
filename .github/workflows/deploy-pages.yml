name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx ng build --configuration pages
      - name: Prepare Pages artifact
        run: |
          cp dist/rorschach-coding-assistant/browser/index.html dist/rorschach-coding-assistant/browser/404.html
          touch dist/rorschach-coding-assistant/browser/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/rorschach-coding-assistant/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
